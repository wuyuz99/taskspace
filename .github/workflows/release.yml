name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      # The same checks as CI, so a tag pushed past a red main still stops here.
      - name: Install tmux and zellij
        env:
          ZELLIJ_VERSION: v0.45.1
        run: scripts/ci-multiplexers.sh
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: End-to-end
        run: |
          go build -o tspace ./cmd/tspace
          scripts/e2e.sh ./tspace
      - name: Build
        run: |
          mkdir -p out
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}" arch="${target#*/}"
            name="tspace_${GITHUB_REF_NAME}_${os}_${arch}"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/wuyuz99/taskspace/internal/cli.version=${GITHUB_REF_NAME}" \
              -o "build/$name/tspace" ./cmd/tspace
            cp LICENSE README.md CHANGELOG.md "build/$name/"
            cp -R docs "build/$name/docs"
            tar -C build -czf "out/$name.tar.gz" "$name"
            # A version-free name gives releases/latest/download a stable link.
            cp "out/$name.tar.gz" "out/tspace_${os}_${arch}.tar.gz"
          done
          (cd out && sha256sum *.tar.gz > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --generate-notes
